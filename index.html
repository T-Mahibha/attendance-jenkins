<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Attendance System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>Attendance Portal</h1>
      <div class="sub">Faculty & Student Access</div>
    </div>

    <div class="form-group">
      <label>Username / Student ID</label>
      <input type="text" id="username" placeholder="Enter username" autocomplete="off">
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter password">
    </div>

    <button id="loginBtn">Sign In →</button>

    <div id="msg" class="message-area" style="display: none;"></div>

    <div class="footer-note" style="margin-top: 1.2rem;">
      <strong>Demo Credentials:</strong><br>
      Admin: admin / admin<br>
      Students: arun/101 | kiran/102 | priya/103 | rahul/104
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    document.getElementById('loginBtn')?.addEventListener('click', login);
    const inputs = document.querySelectorAll('input');
    inputs.forEach(inp => inp.addEventListener('keypress', (e) => { 
      if(e.key === 'Enter') login(); 
    }));
  </script>
</body>
</html>
